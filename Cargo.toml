[package]
name = "shp2geojson-cesium"
version = "0.1.1"
edition = "2024"
description = "High-performance ESRI Shapefile to GeoJSON converter for cesium."
license = "MIT"
repository = "https://github.com/MarkusPersad/shp2geojson-cesium"
homepage = "https://github.com/MarkusPersad/shp2geojson-cesium"
readme = "README.md"
keywords = ["shapefile", "geojson", "gis", "conversion", "cesium"]
categories = ["command-line-utilities", "science::geo"]
exclude = [".github/", "CLAUDE.md", "shp2geojson-guidelines.md", "shp2geojson-mockup.html"]

[[bin]]
name = "shp2geojson-cesium"
path = "src/main.rs"

[lib]
name = "shp2geojson-cesium"
path = "src/lib.rs"

[features]
default = ["reproject"]
reproject = ["dep:proj"]

[dependencies]
anyhow               = "1.0.102"
clap                 = { version = "4.6.0", features = ["derive"] }
console              = "0.15.11"
clap_complete        = "4.6.0"
crossbeam-channel    = "0.5.15"
ctrlc                = "3.5.2"
geojson              = { version = "0.24.2", default-features = true }
indicatif            = "0.17.11"
num_cpus             = "1.17.0"
proj                 = { version = "0.31.0", optional = true }
serde                = { version = "1.0.228", features = ["derive"] }
serde_json           = "1.0.149"
shapefile            = "0.7"
thiserror            = "2.0.18"
toml                 = "0.8.23"
tracing              = "0.1.44"
tracing-subscriber   = { version = "0.3.23", features = ["env-filter"] }
walkdir              = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"